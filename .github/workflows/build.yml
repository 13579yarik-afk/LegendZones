name: Build LegendZones

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Собрать плагин
        run: mvn clean package

      - name: Загрузить JAR
        uses: actions/upload-artifact@v4
        with:
          name: LegendZones
          path: target/*.jar
